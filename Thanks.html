<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You - AA Fragrances</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
body {
  margin:0;
  font-family: 'Inter', sans-serif;
  background: radial-gradient(circle at top, #0a0a0a, #050505);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  text-align: center;
}
.container {
  padding: 50px 30px;
  border-radius: 20px;
  border: 2px solid gold;
  background: rgba(255,255,255,0.02);
  backdrop-filter: blur(10px);
  max-width: 500px;
}
h1 {
  font-family: 'Playfair Display', serif;
  font-size: 48px;
  color: gold;
  margin-bottom: 20px;
  text-shadow: 0 0 15px rgba(255,215,0,.7);
}
p {
  font-size: 18px;
  color: #ccc;
  margin-bottom: 30px;
}
button {
  padding: 15px 40px;
  border-radius: 40px;
  border: 1px solid gold;
  background: transparent;
  color: gold;
  font-size: 18px;
  cursor: pointer;
  transition: 0.3s;
}
button:hover {
  background: gold;
  color: black;
  box-shadow: 0 0 25px rgba(255,215,0,.5);
}
footer {
  margin-top: 40px;
  color: #666;
  font-size: 14px;
}
</style>
</head>
<body>
  <div class="container">
    <h1>Thank You!</h1>
    <p>Your order has been received successfully.<br>We appreciate your purchase and hope you enjoy your fragrance.</p>
    <button onclick="window.location.href='index.html'">Back to Shop</button>
    <footer>© 2026 AA FRAGRANCES — FOUNDED BY ALI</footer>
  </div>
</body>
</html>
